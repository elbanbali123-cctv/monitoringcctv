<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard CCTV Bandara Ngurah Rai</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }
  .left-panel {
    flex: 1.5;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #ccc;
    padding: 10px;
    box-sizing: border-box;
    background: #f9f9f9;
    transition: all 0.3s ease;
  }
  .left-panel.hidden { display: none; }
  h2, h3 { margin: 0 0 10px 0; }
  .table-container {
    flex: 1;
    overflow-y: auto;
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 10px;
    background: white;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    border: 1px solid #ccc;
    padding: 8px 5px;
    text-align: center;
    font-size: 13px;
  }
  th { background: #f2f2f2; }
  tr:hover { background: #f0f0f0; cursor: pointer; }
  .up { color: green; font-weight: bold; }
  .down { color: red; font-weight: bold; }
  .form-section {
    margin-top: 10px;
    padding: 10px;
    border: 1px solid #aaa;
    border-radius: 6px;
    background: #fff;
  }
  .form-section input, .form-section select {
    padding: 6px;
    margin: 4px 0;
    width: 100%;
    box-sizing: border-box;
  }
  .form-section button {
    padding: 8px 15px;
    margin-top: 5px;
    background: #007BFF;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .form-section button:hover { background: #0056b3; }
  .delete-btn {
    padding: 3px 7px;
    background: red;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .delete-btn:hover { background: darkred; }
  .edit-btn {
    padding: 3px 7px;
    background: orange;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .edit-btn:hover { background: darkorange; }
  .counters { margin: 5px 0; font-weight: bold; }
  .counter-up { color: green; margin-right: 20px; }
  .counter-down { color: red; }
  .right-panel { flex: 2; height: 100%; position: relative; }

  #map { height: 100%; width: 100%; }
  #togglePanel {
    position: absolute;
    top: 10px;
    left: 15px;
    z-index: 1001;
    background: #007BFF;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;

  }
  #togglePanel:hover { background: #0056b3; }
  #dateTime {
    position: absolute;
    top: 10px;
    right: 15px;
    background: rgba(255,255,255,0.9);
    padding: 5px 10px;
    border-radius: 4px;
    font-weight: bold;
    z-index: 1000;
  }

   /* Logo di tengah atas peta */
  #mapLogo {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 100px;
    z-index: 1002;
  }
  #searchBox {
    position: absolute;
    top: 50px;
    right: 15px;
    padding: 6px 10px;
    width: 200px;
    border: 1px solid #aaa;
    border-radius: 4px;
    z-index: 1001;
  }
</style>
</head>
<body>

  <div class="left-panel" id="leftPanel">
    <h2 style="text-align:center ;">Daftar CCTV</h2>
    <div class="counters">
      UP: <span id="countUp" class="counter-up">0</span>
      DOWN: <span id="countDown" class="counter-down">0</span>
    </div>
    <div class="table-container">
      <table id="cctvTable">
        <thead>
          <tr>
            <th>No</th>
            <th>Nama CCTV</th>
            <th>IP</th>
            <th>Status</th>
            <th>URL</th>
            <th>Koordinat</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody></tbody>
        <img src="logo.png" alt="Logo" id="mapLogo">
      </table>
    </div>
    <div class="form-section">
      <h3>Tambah CCTV Baru</h3>
      <input type="text" id="cctvName" placeholder="Nama CCTV">
      <input type="text" id="cctvIP" placeholder="IP CCTV">
      <input type="text" id="cctvURL" placeholder="URL CCTV">
      <select id="cctvStatus">
        <option value="UP">UP</option>
        <option value="DOWN">DOWN</option>
      </select>
      <input type="text" id="cctvLat" placeholder="Latitude">
      <input type="text" id="cctvLng" placeholder="Longitude">
      <button id="btnTambah">Tambah CCTV</button>
    </div>
  </div>

  <div class="right-panel">
    <button id="togglePanel">Sembunyikan Panel</button>
    <div id="map"></div>
    <div id="dateTime"></div>
    <input type="text" id="searchBox" placeholder="Cari CCTV...">
  </div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let map;
let markers = [];
let cctvs = JSON.parse(localStorage.getItem("cctvData")) || [
  {lat:-8.748169,lng:115.167473,title:"CCTV Gerbang Utama",ip:"10.2.55.201",status:"UP",url:""},
  {lat:-8.747200,lng:115.169000,title:"CCTV Parkiran",ip:"10.2.55.202",status:"DOWN",url:""},
  {lat:-8.749000,lng:115.166500,title:"CCTV Terminal Domestik",ip:"10.2.55.203",status:"UP",url:""},
  {lat:-8.747800,lng:115.165800,title:"CCTV Terminal Internasional",ip:"10.2.55.204",status:"UP",url:""}
];

function createMarkerIcon(status){
  const color = status==="UP"?"green":"red";
  return L.icon({
    iconUrl:`https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
    shadowUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize:[25,41], iconAnchor:[12,41], popupAnchor:[1,-34], shadowSize:[41,41]
  });
}

function initMap(){
  map = L.map('map').setView([-8.748169,115.167473],16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ maxZoom:25 }).addTo(map);
  renderTable(cctvs);
  map.on("click",function(e){
    document.getElementById("cctvLat").value = e.latlng.lat.toFixed(6);
    document.getElementById("cctvLng").value = e.latlng.lng.toFixed(6);
  });
}

function renderTable(data){
  let tbody=document.querySelector("#cctvTable tbody");
  tbody.innerHTML="";
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  let countUp=0,countDown=0;

  data.forEach((cctv,index)=>{
    if(cctv.status==="UP") countUp++; else countDown++;
    let marker=L.marker([cctv.lat,cctv.lng],{icon:createMarkerIcon(cctv.status)}).addTo(map);
    marker.bindPopup(`<b>${cctv.title}</b><br>IP: ${cctv.ip}<br>Status: ${cctv.status}<br>Koordinat: ${cctv.lat}, ${cctv.lng}<br><a href="${cctv.url}" target="_blank">Lihat CCTV</a>`);
    markers.push(marker);

    let row=document.createElement("tr");
    row.innerHTML=`
      <td>${index+1}</td>
      <td>${cctv.title}</td>
      <td>${cctv.ip}</td>
      <td class="${cctv.status==="UP"?"up":"down"}">${cctv.status}</td>
      <td><a href="${cctv.url}" target="_blank">Link</a></td>
      <td>${cctv.lat}, ${cctv.lng}</td>
      <td>
        <button class="edit-btn">Edit Koordinat</button>
        <button class="delete-btn">Hapus</button>
      </td>
    `;

    // Tombol hapus
    row.querySelector(".delete-btn").addEventListener("click",()=>{
      const input=prompt(`Masukkan password untuk menghapus CCTV "${cctv.title}":`);
      const password="admin123";
      if(input===password){
        cctvs.splice(index,1);
        localStorage.setItem("cctvData",JSON.stringify(cctvs));
        renderTable(cctvs);
      } else if(input!==null){ alert("Password salah! Data tidak dihapus."); }
    });

    // Tombol edit koordinat
    row.querySelector(".edit-btn").addEventListener("click",()=>{
      const input=prompt("Masukkan password untuk mengedit koordinat:");
      const password="admin123";
      if(input===password){
        let newLat=prompt("Masukkan Latitude baru:",cctv.lat);
        let newLng=prompt("Masukkan Longitude baru:",cctv.lng);
        if(newLat && newLng && !isNaN(newLat) && !isNaN(newLng)){
          cctvs[index].lat=parseFloat(newLat);
          cctvs[index].lng=parseFloat(newLng);
          localStorage.setItem("cctvData",JSON.stringify(cctvs));
          renderTable(cctvs);
        } else { alert("Koordinat tidak valid!"); }
      } else if(input!==null){ alert("Password salah! Koordinat tidak diubah."); }
    });

    row.addEventListener("click",(e)=>{
      if(!e.target.classList.contains("delete-btn") && !e.target.classList.contains("edit-btn")){
        map.setView([cctv.lat,cctv.lng],18); marker.openPopup();
      }
    });

    tbody.appendChild(row);
  });

  document.getElementById("countUp").innerText=countUp;
  document.getElementById("countDown").innerText=countDown;
  localStorage.setItem("cctvData",JSON.stringify(cctvs));
}

function addCCTV(){
  let name=document.getElementById("cctvName").value.trim();
  let ip=document.getElementById("cctvIP").value.trim();
  let url=document.getElementById("cctvURL").value.trim();
  let status=document.getElementById("cctvStatus").value;
  let lat=parseFloat(document.getElementById("cctvLat").value);
  let lng=parseFloat(document.getElementById("cctvLng").value);
  if(!name||!ip||isNaN(lat)||isNaN(lng)){ alert("Mohon isi semua field dengan benar!"); return; }
  cctvs.push({lat,lng,title:name,ip,status,url});
  localStorage.setItem("cctvData",JSON.stringify(cctvs));
  renderTable(cctvs);
  document.getElementById("cctvName").value="";
  document.getElementById("cctvIP").value="";
  document.getElementById("cctvURL").value="";
  document.getElementById("cctvLat").value="";
  document.getElementById("cctvLng").value="";
}
document.getElementById("btnTambah").addEventListener("click",addCCTV);

document.getElementById("searchBox").addEventListener("input",function(){
  const keyword=this.value.toLowerCase();
  const filtered=cctvs.filter(cctv=>
    cctv.title.toLowerCase().includes(keyword) ||
    cctv.ip.toLowerCase().includes(keyword)
  );
  renderTable(filtered);
});

document.getElementById("togglePanel").addEventListener("click",()=>{
  const panel=document.getElementById("leftPanel");
  panel.classList.toggle("hidden");
  document.getElementById("togglePanel").innerText=panel.classList.contains("hidden")?"Tampilkan Panel":"Sembunyikan Panel";
  setTimeout(()=>{ map.invalidateSize(); },300);
});

function updateDateTime(){
  const now=new Date();
  const options={year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'};
  document.getElementById('dateTime').innerText=now.toLocaleDateString('id-ID',options).replace(',', '');
}
setInterval(updateDateTime,1000);
updateDateTime();
initMap();
</script>
</body>
</html>
