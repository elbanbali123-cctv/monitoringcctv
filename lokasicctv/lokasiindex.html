<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard CCTV</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
  body { margin:0; font-family:Arial; display:flex; height:100vh; }
  .sidebar { width:500px; background:#1f2937; color:white; padding:30px; overflow-y:auto; }
  .sidebar h2 { margin-top:0; }
  input, select, button { width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box; }
  #map { flex:1; position: relative; } 
  table { width:100%; border-collapse:collapse; margin-top:10px; background:#fff; color:#000; }
  th, td { border:1px solid #ccc; padding:6px; font-size:14px; text-align:left; }
  .status-up { color:green; font-weight:bold; }
  .status-down { color:red; font-weight:bold; }
  .row-highlight { background:#fff3b0 !important; }
  .actions button { margin-right:6px; padding:4px 6px; width:auto; }

  .map-search-box {
    position: absolute;
    top: 15px;
    right: 15px;
    background: white;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 0 8px rgba(0,0,0,0.3);
    z-index: 9999;
    width: 240px;
  }
  .map-search-box input,
  .map-search-box button {
    width: 100%;
    margin-bottom: 6px;
    padding: 6px;
    box-sizing: border-box;
  }

  .map-logo {
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    width: 300px;
    pointer-events: none;
  }

  /* Summary container dengan tiga kolom */
  #map-summary-wrapper {
    position: absolute;
    top: 100px;
    left: 15px;
    display: flex;
    gap: 5px;
    z-index: 9999;
  }
  .summary-box {
    padding: 10px 15px;
    border-radius: 6px;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    min-width: 100px;
  }
  .summary-total { background: #4b5563; } /* abu-abu gelap */
  .summary-up    { background: #16a34a; } /* hijau */
  .summary-down  { background: #dc2626; } /* merah */
  .summary-box h4 { margin: 0 0 5px; font-size: 14px; }
  .summary-box .count { font-size: 20px; font-weight: bold; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>Dashboard CCTV</h2>

  <div class="map-search-box">
    <input type="text" id="searchInput" placeholder="Search (Nama / IP / Status)..." />
    <button id="clearBtn">Clear Search</button>
  </div>

  <div class="sticky-box">
    <h3>Tambah CCTV</h3>
    <input id="nama" placeholder="Nama Kamera" />
    <input id="ip" placeholder="IP Address" />
    <select id="status">
      <option value="UP">UP</option>
      <option value="DOWN">DOWN</option>
    </select>
    <input id="url" placeholder="URL Stream (contoh: http://...)" />
    <input id="lat" placeholder="Latitude (contoh: -8.748000)" />
    <input id="lng" placeholder="Longitude (contoh: 115.167000)" />
    <button id="addBtn">Tambah</button>
  </div>

  <h3>Daftar CCTV</h3>
  <table>
    <thead>
      <tr>
        <th>Nama</th>
        <th>IP</th>
        <th>Status</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div id="map">
  <img src="airports.png" class="map-logo">
  <div id="map-summary-wrapper">
    <div class="summary-box summary-total">
      <h4>Total Kamera</h4>
      <div id="totalCount" class="count">0</div>
    </div>
    <div class="summary-box summary-up">
      <h4>UP</h4>
      <div id="upCount" class="count">0</div>
    </div>
    <div class="summary-box summary-down">
      <h4>DOWN</h4>
      <div id="downCount" class="count">0</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let cctvData = JSON.parse(localStorage.getItem("cctvData") || "[]");
let markers = {};

let needSave = false;
cctvData = cctvData.map(item => {
  if (!item.id) {
    needSave = true;
    return Object.assign({ id: Date.now().toString() + Math.random().toString(36).slice(2) }, item);
  }
  return item;
});
if (needSave) localStorage.setItem("cctvData", JSON.stringify(cctvData));

function saveData() {
  localStorage.setItem("cctvData", JSON.stringify(cctvData));
}

const iconUp = L.icon({
  iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png",
  shadowUrl: "https://unpkg.com/leaflet/dist/images/marker-shadow.png",
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34]
});
const iconDown = L.icon({
  iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
  shadowUrl: "https://unpkg.com/leaflet/dist/images/marker-shadow.png",
  iconSize: [25, 41],
  iconAnchor: [12, 41],
  popupAnchor: [1, -34]
});

const map = L.map('map').setView([-8.748, 115.167], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22 }).addTo(map);

function clearMarkers() {
  Object.values(markers).forEach(m => {
    try { map.removeLayer(m); } catch (e) {}
  });
  markers = {};
}

function renderMarkers() {
  clearMarkers();
  cctvData.forEach(cctv => {
    const lat = parseFloat(cctv.lat);
    const lng = parseFloat(cctv.lng);
    if (isNaN(lat) || isNaN(lng)) return;

    const iconUsed = (cctv.status === 'UP') ? iconUp : iconDown;
    const m = L.marker([lat, lng], { icon: iconUsed }).addTo(map);

    const warna = (cctv.status === 'UP') ? "green" : "red";
    const ipLink = cctv.ip
      ? `<a href="${cctv.url || ("http://" + cctv.ip)}" target="_blank" style="color:${warna}">${cctv.ip}</a>`
      : '';
    const streamLink = cctv.url ? `<a href="${cctv.url}" target="_blank" style="color:${warna}">Buka Stream</a>` : '';

    m.bindPopup(`
      <b>${escapeHtml(cctv.nama)}</b><br>
      IP: ${ipLink}<br>
      Status: <span style="color:${warna}">${cctv.status}</span><br>
      ${streamLink}
    `);

    markers[cctv.id] = m;
  });
}

function renderTableFromArray(arr) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  arr.forEach(item => {
    const tr = document.createElement('tr');
    tr.dataset.id = item.id;

    const tdNama = document.createElement('td');
    tdNama.innerText = item.nama || '';
    const tdIp = document.createElement('td');
    if (item.ip) {
      const a = document.createElement('a');
      a.href = item.url || ("http://" + item.ip);
      a.target = "_blank";
      a.innerText = item.ip;
      tdIp.appendChild(a);
    } else tdIp.innerText = '';

    const tdStatus = document.createElement('td');
    tdStatus.className = (item.status === 'UP') ? 'status-up' : 'status-down';
    tdStatus.innerHTML = (item.status || '') + (item.url ? '<br><a href="' + item.url + '" target="_blank">Stream</a>' : '');

    const tdAksi = document.createElement('td');
    tdAksi.className = 'actions';
    const btnEdit = document.createElement('button');
    btnEdit.innerText = 'Edit';
    btnEdit.onclick = () => editCCTV(item.id);
    const btnHapus = document.createElement('button');
    btnHapus.innerText = 'Hapus';
    btnHapus.onclick = () => deleteCCTV(item.id);
    tdAksi.appendChild(btnEdit);
    tdAksi.appendChild(btnHapus);

    tr.appendChild(tdNama);
    tr.appendChild(tdIp);
    tr.appendChild(tdStatus);
    tr.appendChild(tdAksi);

    tbody.appendChild(tr);
  });
}

function renderTable() {
  renderTableFromArray(cctvData);
}

function updateSummary() {
  const total = cctvData.length;
  const up = cctvData.filter(c => c.status === 'UP').length;
  const down = cctvData.filter(c => c.status === 'DOWN').length;

  document.getElementById('totalCount').innerText = total;
  document.getElementById('upCount').innerText = up;
  document.getElementById('downCount').innerText = down;
}

function refreshAll() {
  renderMarkers();
  renderTable();
  updateSummary();
}

document.getElementById('addBtn').addEventListener('click', () => {
  const nama = document.getElementById('nama').value.trim();
  const ip = document.getElementById('ip').value.trim();
  const status = document.getElementById('status').value;
  const url = document.getElementById('url').value.trim();
  const lat = document.getElementById('lat').value.trim();
  const lng = document.getElementById('lng').value.trim();

  if (!nama || !ip || isNaN(parseFloat(lat)) || isNaN(parseFloat(lng))) {
    alert('Isi semua data dengan benar (nama, ip, lat, lng).');
    return;
  }

  const newItem = {
    id: Date.now().toString() + Math.random().toString(36).slice(2),
    nama, ip, status, url,
    lat: parseFloat(lat),
    lng: parseFloat(lng)
  };
  cctvData.push(newItem);
  saveData();

  document.getElementById('nama').value = '';
  document.getElementById('ip').value = '';
  document.getElementById('url').value = '';
  document.getElementById('lat').value = '';
  document.getElementById('lng').value = '';

  refreshAll();
});

function editCCTV(id) {
  const pwd = prompt('Masukkan password edit:');
  if (pwd !== 'admin') { alert('Password salah!'); return; }

  const item = cctvData.find(x => x.id === id);
  if (!item) return;

  const newNama = prompt('Nama baru:', item.nama) || item.nama;
  const newIp = prompt('IP baru:', item.ip) || item.ip;
  const newStatus = prompt('Status (UP/DOWN):', item.status) || item.status;
  const newUrl = prompt('URL stream (kosong untuk tidak berubah):', item.url || '') || item.url;
  const newLat = prompt('Latitude:', item.lat) || item.lat;
  const newLng = prompt('Longitude:', item.lng) || item.lng;

  if (!newNama || !newIp || isNaN(parseFloat(newLat)) || isNaN(parseFloat(newLng))) {
    alert('Nama, IP, Latitude, dan Longitude harus diisi dengan benar.');
    return;
  }

  item.nama = newNama;
  item.ip = newIp;
  item.status = (newStatus === 'DOWN') ? 'DOWN' : 'UP';
  item.url = newUrl;
  item.lat = parseFloat(newLat);
  item.lng = parseFloat(newLng);

  saveData();
  refreshAll();
}

function deleteCCTV(id) {
  const pwd = prompt('Masukkan password hapus:');
  if (pwd !== 'admin') { alert('Password salah!'); return; }

  if (!confirm('Yakin ingin menghapus CCTV ini?')) return;

  cctvData = cctvData.filter(x => x.id !== id);
  saveData();
  refreshAll();
}

document.getElementById('searchInput').addEventListener('input', function () {
  const keyword = this.value.trim().toLowerCase();

  if (keyword === '') {
    renderTable();
    map.setView([-8.748, 115.167], 13);
    return;
  }

  const matched = [];
  const others = [];

  cctvData.forEach(item => {
    const nama = (item.nama || '').toLowerCase();
    const ip = (item.ip || '').toLowerCase();
    const status = (item.status || '').toLowerCase();
    if (nama.includes(keyword) || ip.includes(keyword) || status.includes(keyword)) matched.push(item);
    else others.push(item);
  });

  const final = [...matched, ...others];
  renderTableFromArray(final);

  document.querySelectorAll('#tableBody tr').forEach(row => {
    const id = row.dataset.id;
    const isMatched = matched.find(x => x.id === id);
    if (isMatched) row.classList.add('row-highlight');
  });

  if (matched.length > 0) {
    const first = matched[0];
    if (markers[first.id]) {
      map.setView([first.lat, first.lng], 20);
      markers[first.id].openPopup();
      const firstRow = document.querySelector('#tableBody tr[data-id="' + first.id + '"]');
      if (firstRow) firstRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
});

document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  renderTable();
  document.querySelectorAll('#tableBody tr').forEach(r => r.classList.remove('row-highlight'));
  map.setView([-8.748, 115.167], 13);
  map.closePopup();
});

function escapeHtml(unsafe) {
  return (unsafe || '').replace(/[&<\"'>]/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;','\\' : '&#039;'})[m];});
}

refreshAll();
</script>

</body>
</html>
